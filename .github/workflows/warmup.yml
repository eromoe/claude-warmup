name: Claude Code Warmup

on:
  schedule:
    - cron: '3-58/5 4-6 * * *'
      timezone: 'Asia/Shanghai'
    - cron: '3-58/5 9-11 * * *'
      timezone: 'Asia/Shanghai'
    - cron: '3-58/5 14-16 * * *'
      timezone: 'Asia/Shanghai'
  repository_dispatch:
    types: [warmup]
  workflow_dispatch: {}

concurrency:
  group: claude-warmup
  cancel-in-progress: true

jobs:
  warmup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TZ: Asia/Shanghai
      # 每条 cron 对应一个目标小时：4-6→6，9-11→11，14-16→16
      EARLY_MINUTES: '5'
      STATE_FILE: ${{ github.workspace }}/.warmup-state
    steps:
      - name: Restore slot state
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.warmup-state
          key: warmup-slots-${{ github.run_id }}
          restore-keys: |
            warmup-slots-

      - name: Gate
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE_CRON: ${{ github.event.schedule }}
          CLIENT_PAYLOAD_TARGET: ${{ github.event.client_payload.target }}
        run: |
          set -euo pipefail

          today=$(date +%F)
          now_min=$((10#$(date +%H) * 60 + 10#$(date +%M)))
          touch "${STATE_FILE}"

          echo "now=$(date '+%F %T %Z')"
          echo "event=${EVENT_NAME}"
          echo "schedule_cron=${SCHEDULE_CRON:-}"

          target=""
          case "${SCHEDULE_CRON:-}" in
            '3-58/5 4-6 * * *')   target=6 ;;
            '3-58/5 9-11 * * *')  target=11 ;;
            '3-58/5 14-16 * * *') target=16 ;;
          esac

          if [[ -z "${target}" ]] && [[ "${CLIENT_PAYLOAD_TARGET:-}" =~ ^(6|11|16)$ ]]; then
            target="${CLIENT_PAYLOAD_TARGET}"
          fi

          if [[ -z "${target}" ]]; then
            if   (( now_min >= 805 )); then target=16
            elif (( now_min >= 505 )); then target=11
            else target=6
            fi
          fi

          slot_key="${today}:${target}"
          open_min=$((target * 60 - EARLY_MINUTES))
          (( open_min < 0 )) && open_min=0

          echo "slot=${slot_key}"

          if grep -qxF "${slot_key}" "${STATE_FILE}"; then
            should_run=false
            reason="round ${target}:00 already done — skip later tickets"
          elif [[ "${EVENT_NAME}" == "workflow_dispatch" || "${EVENT_NAME}" == "repository_dispatch" ]]; then
            should_run=true
            reason="dispatch for ${target}:00"
          elif (( now_min < open_min )); then
            should_run=false
            reason="before ${target}:00 ($(date +%H:%M)) — wait"
          else
            should_run=true
            reason="first ticket at/past ${target}:00 — run"
          fi

          echo "decision=${should_run}  (${reason})"
          echo "should_run=${should_run}" >> "${GITHUB_OUTPUT}"
          echo "slot_key=${slot_key}" >> "${GITHUB_OUTPUT}"

      - name: Validate configuration
        if: steps.gate.outputs.should_run == 'true'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_OAUTH_TOKEN }}
        run: |
          if [ -z "${CLAUDE_CODE_OAUTH_TOKEN}" ]; then
            echo "CLAUDE_OAUTH_TOKEN secret is not set."
            exit 1
          fi

      - name: Install Claude Code
        if: steps.gate.outputs.should_run == 'true'
        run: npm install -g @anthropic-ai/claude-code

      - name: Ping Claude
        if: steps.gate.outputs.should_run == 'true'
        id: ping
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_OAUTH_TOKEN }}
        run: |
          mkdir -p ~/.claude
          echo '{"hasCompletedOnboarding":true}' > ~/.claude.json
          output_file="$(mktemp)"

          max_attempts=10
          retry_delay=30
          attempt=1

          while true; do
            set +e
            claude -p "hi" --model haiku --no-session-persistence >"$output_file" 2>&1
            status=$?
            set -e
            echo "--- ping attempt ${attempt}/${max_attempts} (exit ${status}) ---"
            cat "$output_file"

            if [ $status -eq 0 ] || grep -qi "rate limit" "$output_file"; then
              echo "ok=true" >> "${GITHUB_OUTPUT}"
              echo "✓ Warmup complete"
              exit 0
            fi

            if grep -Eiq "expired|unauthorized|invalid token|authentication|auth failed|login required|not logged in" "$output_file"; then
              echo "ok=false" >> "${GITHUB_OUTPUT}"
              echo "Claude token appears invalid or expired — no retry."
              exit 1
            fi

            if [ $attempt -ge $max_attempts ]; then
              break
            fi

            echo "attempt ${attempt} failed — retrying in ${retry_delay}s"
            sleep $retry_delay
            attempt=$((attempt + 1))
          done

          echo "ok=false" >> "${GITHUB_OUTPUT}"
          echo "Claude warmup failed after ${max_attempts} attempts."
          exit $status

      - name: Mark round done
        if: steps.gate.outputs.should_run == 'true' && steps.ping.outputs.ok == 'true'
        run: |
          slot_key='${{ steps.gate.outputs.slot_key }}'
          grep -qxF "${slot_key}" "${STATE_FILE}" 2>/dev/null || echo "${slot_key}" >> "${STATE_FILE}"
          echo "marked ${slot_key}"
          cat "${STATE_FILE}"
