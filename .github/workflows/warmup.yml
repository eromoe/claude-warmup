name: Claude Code Warmup

on:
  schedule:
    - cron: '3-58/5 4-7 * * *'
      timezone: 'Asia/Shanghai'
    - cron: '3-58/5 9-12 * * *'
      timezone: 'Asia/Shanghai'
    - cron: '3-58/5 14-17 * * *'
      timezone: 'Asia/Shanghai'
  repository_dispatch:
    types: [warmup]
  workflow_dispatch: {}

concurrency:
  group: claude-warmup
  cancel-in-progress: false

jobs:
  warmup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TZ: Asia/Shanghai
      # 名义班次（分钟）：6:25=385，11:28=688，16:31=991；链式空隙 BUF，宽容期 GRACE
      BUF_MIN: '2'
      GRACE_MIN: '120'
      STATE_FILE: ${{ github.workspace }}/.warmup-state
    steps:
      - name: Restore slot state
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.warmup-state
          key: warmup-slots-${{ github.run_id }}
          restore-keys: |
            warmup-slots-

      - name: Gate
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE_CRON: ${{ github.event.schedule }}
        run: |
          set -euo pipefail

          today=$(date +%F)
          now_min=$((10#$(date +%H) * 60 + 10#$(date +%M)))
          now_epoch=$(date +%s)
          touch "${STATE_FILE}"

          echo "now=$(date '+%F %T %Z')"
          echo "event=${EVENT_NAME}"
          echo "schedule_cron=${SCHEDULE_CRON:-}"

          WINDOW_MIN=300
          nominal=""
          if   (( now_min >= 991 )); then nominal=991
          elif (( now_min >= 688 )); then nominal=688
          elif (( now_min >= 385 )); then nominal=385
          fi

          last_epoch=""
          if grep -q '^last=' "${STATE_FILE}"; then
            last_epoch=$(sed -n 's/^last=//p' "${STATE_FILE}" | tail -n 1)
          fi

          slot_key="${today}:${nominal:-manual}"
          printf -v nominal_hm '%02d:%02d' $(( ${nominal:-0} / 60 )) $(( ${nominal:-0} % 60 ))

          if [[ "${EVENT_NAME}" == "workflow_dispatch" ]]; then
            should_run=true
            reason="manual dispatch — run"
          elif [[ -z "${nominal}" ]]; then
            should_run=false
            reason="before 06:25 — outside anchor windows"
          elif grep -qxF "${slot_key}" "${STATE_FILE}"; then
            should_run=false
            reason="slot ${nominal_hm} already anchored — skip"
          elif (( now_min > nominal + GRACE_MIN )); then
            should_run=false
            reason="past ${GRACE_MIN}min grace of ${nominal_hm} — skip"
          elif [[ -z "${last_epoch}" ]]; then
            should_run=true
            reason="no previous anchor on record — run"
          elif (( now_epoch - last_epoch >= (WINDOW_MIN + BUF_MIN) * 60 )); then
            should_run=true
            reason="previous window expired — run"
          else
            should_run=false
            wait_min=$(( (WINDOW_MIN + BUF_MIN) * 60 - (now_epoch - last_epoch) ))
            reason="previous window active ${wait_min}s more — skip"
          fi

          echo "slot=${slot_key}"
          echo "decision=${should_run}  (${reason})"
          echo "should_run=${should_run}" >> "${GITHUB_OUTPUT}"
          echo "slot_key=${slot_key}" >> "${GITHUB_OUTPUT}"

      - name: Validate configuration
        if: steps.gate.outputs.should_run == 'true'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_OAUTH_TOKEN }}
        run: |
          if [ -z "${CLAUDE_CODE_OAUTH_TOKEN}" ]; then
            echo "CLAUDE_OAUTH_TOKEN secret is not set."
            exit 1
          fi

      - name: Install Claude Code
        if: steps.gate.outputs.should_run == 'true'
        run: npm install -g @anthropic-ai/claude-code

      - name: Ping Claude
        if: steps.gate.outputs.should_run == 'true'
        id: ping
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_OAUTH_TOKEN }}
        run: |
          mkdir -p ~/.claude
          echo '{"hasCompletedOnboarding":true}' > ~/.claude.json
          output_file="$(mktemp)"

          max_attempts=10
          retry_delay=30
          attempt=1

          while true; do
            set +e
            claude -p "hi" --model haiku --no-session-persistence >"$output_file" 2>&1
            status=$?
            set -e
            echo "--- ping attempt ${attempt}/${max_attempts} (exit ${status}) ---"
            cat "$output_file"

            if [ $status -eq 0 ] || grep -qi "rate limit" "$output_file"; then
              echo "ok=true" >> "${GITHUB_OUTPUT}"
              echo "✓ Warmup complete"
              exit 0
            fi

            if grep -Eiq "expired|unauthorized|invalid token|authentication|auth failed|login required|not logged in" "$output_file"; then
              echo "ok=false" >> "${GITHUB_OUTPUT}"
              echo "Claude token appears invalid or expired — no retry."
              exit 1
            fi

            if [ $attempt -ge $max_attempts ]; then
              break
            fi

            echo "attempt ${attempt} failed — retrying in ${retry_delay}s"
            sleep $retry_delay
            attempt=$((attempt + 1))
          done

          echo "ok=false" >> "${GITHUB_OUTPUT}"
          echo "Claude warmup failed after ${max_attempts} attempts."
          exit $status

      - name: Mark round done
        if: steps.gate.outputs.should_run == 'true' && steps.ping.outputs.ok == 'true'
        run: |
          slot_key='${{ steps.gate.outputs.slot_key }}'
          now_epoch=$(date +%s)
          today=$(date +%F)
          grep -qxF "${slot_key}" "${STATE_FILE}" 2>/dev/null || echo "${slot_key}" >> "${STATE_FILE}"
          sed -i '/^last=/d' "${STATE_FILE}"
          echo "last=${now_epoch}" >> "${STATE_FILE}"
          grep -E "^last=|^${today}:" "${STATE_FILE}" > "${STATE_FILE}.tmp" || true
          mv "${STATE_FILE}.tmp" "${STATE_FILE}"
          echo "marked ${slot_key} last=${now_epoch}"
          cat "${STATE_FILE}"
